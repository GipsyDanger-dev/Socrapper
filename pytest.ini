[pytest]
DJANGO_SETTINGS_MODULE = tests.settings_test
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
env =
    DB_ENGINE=sqlite
    SECRET_KEY=test-secret-key-not-for-production
    ALLOWED_HOSTS=localhost,127.0.0.1,testserver
