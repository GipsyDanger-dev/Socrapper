name: Deploy Socrapper to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /www/wwwroot/socrapper
            echo "[DEPLOY] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[DEPLOY] Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "[DEPLOY] Running migrations..."
            python manage.py migrate --noinput

            echo "[DEPLOY] Collecting static files..."
            python manage.py collectstatic --noinput

            echo "[DEPLOY] Installing npm packages..."
            npm install --silent

            echo "[DEPLOY] Building frontend..."
            npm run build

            echo "[DEPLOY] Restarting Gunicorn..."
            sudo systemctl restart socrapper

            echo "[DEPLOY] Done! Site updated."
